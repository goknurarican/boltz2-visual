<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boltz-2 · Live Flow</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="mask-icon" href="favicon.svg" color="#4ade80">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #0b0c0d;
    --panel:       #131417;
    --panel2:      #191b1f;
    --border:      #24262b;
    --border-hi:   #3a3d43;
    --text:        #b8bcc3;
    --text-strong: #dcdfe4;
    --muted:       #6a6e75;
    --accent:      #7c85f4;

    --data-prot: #7a9ec9;
    --data-lig:  #7dbb8f;
    --data-msa:  #c9a976;
    --data-tmpl: #a389c4;
    --trunk:     #9b90d1;
    --struct:    #d19b7d;
    --conf:      #7dbfc4;
    --aff:       #d47a86;
    --pass1:     #7c85f4;
    --pass2:     #d47a86;
    --edge:      #3a3d43;
    --edge-hi:   #d47a86;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 12px; line-height: 1.55; font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 12px; margin: 0; font-weight: 500; color: var(--text-strong); }
  h1 a { color: inherit; text-decoration: none; border-bottom: 1px dotted transparent; transition: border-color 0.15s, color 0.15s; }
  h1 a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; }

  .cfg { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .cfg label { display: inline-flex; align-items: center; gap: 5px; }
  .cfg input[type=number] {
    width: 48px; padding: 3px 6px; font: inherit;
    background: var(--panel2); color: var(--text-strong);
    border: 1px solid var(--border-hi); border-radius: 3px;
    font-family: "IBM Plex Mono", monospace;
  }

  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text); }
  .toggle input {
    appearance: none; width: 26px; height: 14px;
    background: var(--panel2); border: 1px solid var(--border-hi);
    border-radius: 8px; position: relative; cursor: pointer;
  }
  .toggle input:after {
    content: ""; position: absolute; top: 1px; left: 1px;
    width: 10px; height: 10px; background: var(--muted); border-radius: 50%;
    transition: left 0.15s, background 0.15s;
  }
  .toggle input:checked { background: var(--aff); border-color: var(--aff); }
  .toggle input:checked:after { left: 13px; background: var(--bg); }

  .ctrls { display: inline-flex; align-items: center; gap: 4px; }
  .ctrls button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border-hi); border-radius: 3px;
    padding: 4px 10px; font-family: inherit; font-size: 11px;
    cursor: pointer;
  }
  .ctrls button:hover { background: var(--border-hi); color: var(--text-strong); }
  .ctrls .primary {
    background: var(--accent); color: var(--bg); border-color: var(--accent);
    font-weight: 500; min-width: 60px;
  }
  .ctrls .primary:hover { filter: brightness(1.1); }
  .step-count {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--muted); padding: 0 8px;
  }
  .speed { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); }
  .speed input { width: 60px; }

  main { display: grid; grid-template-columns: 1fr 5px 400px; min-height: calc(100vh - 46px); }
  #stage { position: relative; overflow: auto; }
  #divider {
    background: var(--border); cursor: col-resize;
    transition: background 0.15s; user-select: none;
  }
  #divider:hover, body.dragging #divider { background: var(--accent); }
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging * { user-select: none !important; }

  aside {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow: auto;
    position: sticky; top: 46px; height: calc(100vh - 46px);
    display: flex; flex-direction: column;
  }
  .aside-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .aside-progress {
    height: 3px; background: var(--panel2);
    position: relative; border-bottom: 1px solid var(--border);
  }
  .aside-progress-bar {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--accent); transition: width 0.3s;
  }

  aside .kicker {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  aside h2 {
    font-size: 15px; margin: 0 0 8px 0; font-weight: 500;
    color: var(--text-strong); letter-spacing: -0.2px;
  }
  aside .step-badge {
    display: inline-block; font-family: "IBM Plex Mono", monospace;
    font-size: 10px; padding: 1px 6px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 2px;
    margin-right: 6px; vertical-align: middle;
  }
  aside .shape {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; color: var(--data-lig);
    margin: 6px 0; padding: 5px 9px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 3px;
  }
  aside .shape::before { content: "shape  "; color: var(--muted); }
  aside .file {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px; color: var(--muted);
    margin: 6px 0 12px 0; word-break: break-all;
  }
  aside .file::before { content: "→ "; color: var(--accent); }
  aside p { font-size: 12px; line-height: 1.65; margin: 8px 0; color: var(--text); }
  aside code {
    font-family: "IBM Plex Mono", monospace;
    background: var(--panel2); padding: 1px 5px;
    border: 1px solid var(--border); border-radius: 3px;
    font-size: 10.5px; color: var(--data-msa);
  }

  .op-block {
    margin: 14px 0; padding: 12px;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 4px;
  }
  .op-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--muted); margin-bottom: 10px;
  }
  .op-row {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; margin: 6px 0;
  }
  .op-sym {
    font-family: "IBM Plex Mono", monospace; font-size: 14px;
    color: var(--text-strong); padding: 0 3px;
  }
  .op-formula {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--text); background: var(--bg);
    padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 3px; margin-top: 10px;
    word-break: break-word; line-height: 1.6;
  }

  /* Tensor viz card */
  .tensor {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    padding: 6px 8px; background: var(--bg);
    border: 1px solid var(--border-hi); border-radius: 3px;
    gap: 5px; min-width: 60px;
  }
  .tensor-name {
    font-family: "IBM Plex Mono", monospace; font-size: 10px;
    color: var(--text-strong);
  }
  .tensor-shape {
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
    color: var(--muted);
  }
  .tensor-viz {
    display: block;
  }
  .tensor.scalar .tensor-viz {
    width: 12px; height: 12px; background: currentColor; border-radius: 2px;
  }
  .tensor-3d {
    display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--border-hi);
    border-radius: 3px; padding: 6px;
  }
  .tensor-3d-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted);
    margin-bottom: 4px;
  }
  .tensor-3d-hint { color: var(--accent); font-size: 9.5px; }
  .tensor-3d canvas {
    display: block; cursor: grab;
    background: radial-gradient(ellipse at center, rgba(124,133,244,0.06), transparent 60%);
    border-radius: 2px;
  }
  .tensor-3d canvas:active { cursor: grabbing; }

  .feats-box {
    display: flex; flex-direction: column;
    max-height: 240px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border-hi); border-radius: 3px;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
    min-width: 240px;
  }
  .feats-group {
    padding: 5px 8px 3px;
    font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); border-top: 1px solid var(--border);
  }
  .feats-group:first-child { border-top: none; }
  .feats-row {
    display: grid; grid-template-columns: 8px 1fr auto;
    gap: 8px; align-items: center;
    padding: 2px 8px;
  }
  .feats-row:hover { background: var(--panel2); }
  .feats-dot { width: 6px; height: 6px; border-radius: 50%; }
  .feats-name { color: var(--text-strong); }
  .feats-shape { color: var(--muted); font-size: 9.5px; }

  svg { display: block; }

  .node { cursor: pointer; }
  .node rect { transition: opacity 0.2s, stroke 0.15s, stroke-width 0.15s, fill 0.2s; }
  .node text { pointer-events: none; user-select: none; }
  .node:hover rect { stroke: var(--border-hi); }
  .node.active rect {
    stroke: var(--accent); stroke-width: 2;
    fill: var(--panel2);
    filter: drop-shadow(0 0 12px rgba(124, 133, 244, 0.3));
  }
  .node.active-aff rect {
    stroke: var(--aff); stroke-width: 2;
    fill: var(--panel2);
    filter: drop-shadow(0 0 12px rgba(212, 122, 134, 0.3));
  }

  .edge {
    fill: none; stroke: var(--edge); stroke-width: 1;
    transition: opacity 0.25s, stroke 0.25s, stroke-width 0.25s;
  }
  .edge-label { fill: var(--muted); font-size: 9.5px; font-family: "IBM Plex Mono", monospace; }
  .edge.aff { stroke: var(--edge-hi); stroke-dasharray: 3 3; stroke-width: 1; }
  .band { fill: none; stroke: var(--border); stroke-dasharray: 2 4; stroke-width: 1; }
  .band-label { fill: var(--muted); font-size: 9.5px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }
  .pass-tag { font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 500; letter-spacing: 1px; }

  .dim-affinity .aff-only { opacity: 0.28; }
  .dim-affinity .edge.aff { opacity: 0.22; }
</style>
</head>
<body>

<header>
  <h1><a href="https://github.com/jwohlwend/boltz" target="_blank" rel="noopener noreferrer" title="Open jwohlwend/boltz on GitHub">Boltz-2</a> <span>live architecture flow</span></h1>

  <div class="cfg">
    <label>N_prot <input type="number" id="cfg-prot" value="20" min="4" max="200"></label>
    <label>N_lig  <input type="number" id="cfg-lig"  value="8"  min="1" max="128"></label>
    <label>S (MSA) <input type="number" id="cfg-msa" value="32" min="1" max="256"></label>
  </div>

  <label class="toggle">
    <input type="checkbox" id="affToggle" checked>
    <span>affinity = <span id="affState">true</span></span>
  </label>

  <div class="ctrls">
    <button id="btn-prev" title="Previous step">◀</button>
    <button id="btn-play" class="primary">▶ Play</button>
    <button id="btn-next" title="Next step">▶</button>
    <button id="btn-reset" title="Reset">↺</button>
  </div>

  <div class="step-count">
    <span id="step-cur">0</span> / <span id="step-tot">—</span>
  </div>

  <div class="speed">
    speed
    <input type="range" id="speed" min="500" max="3000" step="250" value="1500">
  </div>
</header>

<main>
  <div id="stage">
    <svg id="svg" width="1220" height="3120" viewBox="0 0 1220 3120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/>
        </marker>
        <marker id="arrow-aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--edge-hi)"/>
        </marker>
      </defs>

      <!-- === BAND 01 === -->
      <rect class="band" x="20" y="20" width="1180" height="180" rx="4"/>
      <text class="band-label" x="34" y="40">01  data preparation</text>

      <g class="node" data-id="protein">
        <rect x="60" y="60" width="220" height="110" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="60" y1="60" x2="60" y2="170" stroke="var(--data-prot)" stroke-width="2"/>
        <text x="76" y="88" fill="var(--data-prot)" font-weight="600" font-size="12">Protein sequence</text>
        <text x="76" y="110" fill="var(--text)" font-size="11">FASTA / mmCIF</text>
        <text x="76" y="128" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">mol_type = PROTEIN (0)</text>
        <text x="76" y="146" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">residue → 1 token</text>
      </g>

      <g class="node" data-id="ligand">
        <rect x="300" y="60" width="220" height="110" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="300" y1="60" x2="300" y2="170" stroke="var(--data-lig)" stroke-width="2"/>
        <text x="316" y="88" fill="var(--data-lig)" font-weight="600" font-size="12">Ligand</text>
        <text x="316" y="110" fill="var(--text)" font-size="11">SMILES / SDF / CCD</text>
        <text x="316" y="128" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">mol_type = NONPOLYMER (3)</text>
        <text x="316" y="146" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">heavy atom → 1 token</text>
      </g>

      <g class="node" data-id="msa">
        <rect x="540" y="60" width="220" height="110" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="540" y1="60" x2="540" y2="170" stroke="var(--data-msa)" stroke-width="2"/>
        <text x="556" y="88" fill="var(--data-msa)" font-weight="600" font-size="12">MSA</text>
        <text x="556" y="110" fill="var(--text)" font-size="11">a3m (mmseqs2 / ColabFold)</text>
        <text x="556" y="128" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">S × N one-hot</text>
        <text x="556" y="146" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">+ deletion + paired</text>
      </g>

      <g class="node" data-id="template">
        <rect x="780" y="60" width="220" height="110" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="780" y1="60" x2="780" y2="170" stroke="var(--data-tmpl)" stroke-width="2"/>
        <text x="796" y="88" fill="var(--data-tmpl)" font-weight="600" font-size="12">Templates (optional)</text>
        <text x="796" y="110" fill="var(--text)" font-size="11">mmCIF — T templates</text>
        <text x="796" y="128" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">Cα / Cβ + frames</text>
        <text x="796" y="146" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">visibility_ids</text>
      </g>

      <g class="node aff-only" data-id="affinfo">
        <rect x="1020" y="60" width="160" height="110" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="1020" y1="60" x2="1020" y2="170" stroke="var(--aff)" stroke-width="2"/>
        <text x="1036" y="88" fill="var(--aff)" font-weight="600" font-size="12">Affinity Info</text>
        <text x="1036" y="110" fill="var(--text)" font-size="11">YAML: affinity</text>
        <text x="1036" y="128" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">binder = chain_id</text>
        <text x="1036" y="146" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">mw = RDKit MolWt</text>
      </g>

      <!-- === BAND 02 === -->
      <rect class="band" x="20" y="220" width="1180" height="130" rx="4"/>
      <text class="band-label" x="34" y="240">02  featurizer  ·  shared inputs</text>

      <g class="node" data-id="tokenize">
        <rect x="60" y="260" width="700" height="80" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="60" y1="260" x2="60" y2="340" stroke="var(--accent)" stroke-width="2"/>
        <text x="76" y="284" fill="var(--text-strong)" font-weight="600" font-size="12">tokenize_structure(struct, affinity)</text>
        <text x="76" y="303" fill="var(--text)" font-size="11">protein: residue-per-token · ligand: atom-per-token</text>
        <text x="76" y="323" fill="var(--muted)" font-size="10" font-family="IBM Plex Mono, monospace">data/tokenize/boltz2.py:132  ·  affinity_mask = (asym_id == affinity.chain_id)</text>
      </g>

      <g class="node aff-only" data-id="featurizer-aff">
        <rect x="780" y="260" width="400" height="80" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="780" y1="260" x2="780" y2="340" stroke="var(--aff)" stroke-width="2"/>
        <text x="796" y="284" fill="var(--aff)" font-weight="600" font-size="12">process_msa_features(affinity=True)</text>
        <text x="796" y="303" fill="var(--text)" font-size="11">query-only profile (max_seqs = 1)</text>
        <text x="796" y="323" fill="var(--muted)" font-size="10" font-family="IBM Plex Mono, monospace">profile_affinity · deletion_mean_affinity · mw</text>
      </g>

      <!-- === PASS 1 === -->
      <rect class="band" x="20" y="380" width="1180" height="1220" rx="4" stroke="var(--pass1)"/>
      <text class="band-label" x="34" y="402" fill="var(--pass1)">pass 1  ·  Boltz2.load_from_checkpoint(checkpoint)  ·  main.py:1314</text>
      <text class="pass-tag" x="1050" y="402" fill="var(--pass1)">trainer.predict #1  →  main.py:1329</text>

      <rect class="band" x="40" y="420" width="1140" height="580" rx="4"/>
      <text class="band-label" x="54" y="440">03  trunk  ·  recycling × (n+1)</text>

      <g class="node" data-id="embed">
        <rect x="60" y="465" width="500" height="100" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="60" y1="465" x2="60" y2="565" stroke="var(--trunk)" stroke-width="2"/>
        <text x="76" y="489" fill="var(--trunk)" font-weight="600" font-size="12">InputEmbedder(feats)</text>
        <text x="76" y="510" fill="var(--text)" font-size="11">AtomEncoder → AtomAttentionEncoder → atoms averaged into tokens</text>
        <text x="76" y="528" fill="var(--text)" font-size="11">+ res_type + msa_profile encoding</text>
        <text x="76" y="551" fill="var(--data-lig)" font-size="11" font-family="IBM Plex Mono, monospace">out  s_inputs [B, N, 384]</text>
      </g>

      <g class="node" data-id="zinit">
        <rect x="60" y="585" width="500" height="120" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="60" y1="585" x2="60" y2="705" stroke="var(--trunk)" stroke-width="2"/>
        <text x="76" y="609" fill="var(--trunk)" font-weight="600" font-size="12">z_init construction</text>
        <text x="76" y="630" fill="var(--text)" font-size="11">z_init = W₁·s[:,:,None] + W₂·s[:,None,:]</text>
        <text x="76" y="648" fill="var(--text)" font-size="11">+ RelativePositionEncoder + token_bonds + ContactConditioning</text>
        <text x="76" y="691" fill="var(--data-lig)" font-size="11" font-family="IBM Plex Mono, monospace">out  z_init [B, N, N, 128]</text>
      </g>

      <g class="node" data-id="template-mod">
        <rect x="600" y="465" width="270" height="70" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>
        <line x1="600" y1="465" x2="600" y2="535" stroke="var(--data-tmpl)" stroke-width="2"/>
        <text x="616" y="489" fill="var(--data-tmpl)" font-weight="600" font-size="12">TemplateV2Module</text>
        <text x="616" y="508" fill="var(--text)" font-size="11">Cα/Cβ distogram + frames</text>
        <text x="616" y="525" fill="var(--muted)" font-size="10.5" font-family="IBM Plex Mono, monospace">z += u   [B, N, N, 128]</text>
      </g>

      <g class="node" data-id="msa-mod">
        <rect x="600" y="555" width="270" height="70" rx="3" fill="var(--panel)" stroke="var(--border)" stroke-width="1"/>

<script>
// ============================================================
// CONFIG (live inputs)
// ============================================================
let cfg = { N_prot: 20, N_lig: 8, S: 32, affinity: true };
const D = { token_s: 384, token_z: 128, atom_s: 128, bins: 64, mono: 60 };  // D.mono is font width factor

function readCfg() {
  cfg.N_prot  = clamp(+document.getElementById('cfg-prot').value || 20, 1, 200);
  cfg.N_lig   = clamp(+document.getElementById('cfg-lig').value  || 8,  1, 128);
  cfg.S       = clamp(+document.getElementById('cfg-msa').value  || 32, 1, 256);
  cfg.affinity= document.getElementById('affToggle').checked;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function N() { return cfg.N_prot + cfg.N_lig; }
function M() { return cfg.N_prot * 8 + cfg.N_lig; } // rough atom count estimate

// ============================================================
// TENSOR VISUALIZATION
// ============================================================
// Draw a small 2D grid; if 3D, stack isometric slabs; 4D shows 2D slice + depth annotation
function seedVal(i, j, k) {
  // deterministic pseudo-random in [0.2, 0.95]
  const v = Math.abs(Math.sin(i * 12.9898 + j * 78.233 + (k || 0) * 37.719) * 43758.5453);
  return 0.2 + (v - Math.floor(v)) * 0.75;
}

let _t3dCounter = 0;
const _pendingT3D = [];   // { id, shape, color }
const _activeT3D  = [];   // Tensor3D instances

// Feats dict contents (what featurizerv2.py returns).
const FEATS = [
  { g: 'token', name: 'token_index',           shape: '[B, N]' },
  { g: 'token', name: 'residue_index',         shape: '[B, N]' },
  { g: 'token', name: 'asym_id',               shape: '[B, N]' },
  { g: 'token', name: 'entity_id',             shape: '[B, N]' },
  { g: 'token', name: 'sym_id',                shape: '[B, N]' },
  { g: 'token', name: 'mol_type',              shape: '[B, N]' },
  { g: 'token', name: 'res_type',              shape: '[B, N, 33]' },
  { g: 'token', name: 'token_bonds',           shape: '[B, N, N]' },
  { g: 'token', name: 'type_bonds',            shape: '[B, N, N]' },
  { g: 'token', name: 'token_pad_mask',        shape: '[B, N]' },
  { g: 'token', name: 'token_resolved_mask',   shape: '[B, N]' },
  { g: 'token', name: 'contact_conditioning',  shape: '[B, N, N, 6]' },
  { g: 'token', name: 'contact_threshold',     shape: '[B, N, N]' },
  { g: 'token', name: 'affinity_token_mask',   shape: '[B, N]' },
  { g: 'atom',  name: 'ref_pos',               shape: '[B, M, 3]' },
  { g: 'atom',  name: 'ref_charge',            shape: '[B, M]' },
  { g: 'atom',  name: 'ref_element',           shape: '[B, M, 128]' },
  { g: 'atom',  name: 'ref_atom_name_chars',   shape: '[B, M, 4, 64]' },
  { g: 'atom',  name: 'ref_space_uid',         shape: '[B, M]' },
  { g: 'atom',  name: 'atom_pad_mask',         shape: '[B, M]' },
  { g: 'atom',  name: 'atom_to_token',         shape: '[B, M, N]' },
  { g: 'atom',  name: 'token_to_rep_atom',     shape: '[B, N, M]' },
  { g: 'msa',   name: 'msa',                   shape: '[B, S, N]' },
  { g: 'msa',   name: 'msa_paired',            shape: '[B, S, N]' },
  { g: 'msa',   name: 'msa_mask',              shape: '[B, S, N]' },
  { g: 'msa',   name: 'profile',               shape: '[B, N, 33]' },
  { g: 'msa',   name: 'deletion_value',        shape: '[B, S, N]' },
  { g: 'msa',   name: 'deletion_mean',         shape: '[B, N]' },
  { g: 'msa',   name: 'has_deletion',          shape: '[B, S, N]' },
  { g: 'aff',   name: 'profile_affinity',      shape: '[B, N, 33]' },
  { g: 'aff',   name: 'deletion_mean_affinity',shape: '[B, N]' },
  { g: 'aff',   name: 'affinity_mw',           shape: 'scalar' },
  { g: 'tmpl',  name: 'template_restype',      shape: '[B, T, N, 33]' },
  { g: 'tmpl',  name: 'template_cb',           shape: '[B, T, N, 3]' },
  { g: 'tmpl',  name: 'template_ca',           shape: '[B, T, N, 3]' },
  { g: 'tmpl',  name: 'template_frame_rot',    shape: '[B, T, N, 3, 3]' },
  { g: 'tmpl',  name: 'template_frame_t',      shape: '[B, T, N, 3]' },
  { g: 'tmpl',  name: 'template_mask',         shape: '[B, T, N]' },
  { g: 'tmpl',  name: 'visibility_ids',        shape: '[B, T, N]' },
];
const FEATS_GROUP_LABEL = { token: 'token-level', atom: 'atom-level', msa: 'msa', aff: 'affinity-only', tmpl: 'template' };
const FEATS_GROUP_COLOR = { token: '#7c85f4', atom: '#d19b7d', msa: '#c9a976', aff: '#d47a86', tmpl: '#a389c4' };

function renderFeatsDict() {
  let html = '';
  let currentGroup = null;
  for (const f of FEATS) {
    if (f.g !== currentGroup) {
      html += `<div class="feats-group">${FEATS_GROUP_LABEL[f.g]}</div>`;
      currentGroup = f.g;
    }
    html += `<div class="feats-row">
      <span class="feats-dot" style="background:${FEATS_GROUP_COLOR[f.g]}"></span>
      <span class="feats-name">${f.name}</span>
      <span class="feats-shape">${f.shape}</span>
    </div>`;
  }
  return `<div class="feats-box">${html}</div>`;
}

function renderTensor(name, shape, color) {
  // Special case: "feats" is a dict returned by featurizerv2 — render its contents
  if (name === 'feats' || (shape.length === 2 && shape[1] === 'F')) {
    return `<div class="tensor">
      <span class="tensor-name">${name} <span style="color:var(--muted)">— dict of ${FEATS.length} tensors</span></span>
      ${renderFeatsDict()}
    </div>`;
  }

  const dims = shape.length;
  const shapeStr = '[' + shape.map(x => typeof x === 'string' ? x : x).join(', ') + ']';

  let vizHtml = '';
  const CELL = 5;
  const MAX = 24;

  if (dims === 1) {
    const n = Math.min(shape[0] === '?' ? 20 : shape[0], MAX);
    const cells = [];
    for (let i = 0; i < n; i++) {
      cells.push(`<rect x="${i*(CELL+1)}" y="0" width="${CELL}" height="${CELL*3}" fill="${color}" opacity="${seedVal(i,0)}"/>`);
    }
    vizHtml = `<svg class="tensor-viz" width="${n*(CELL+1)}" height="${CELL*3}">${cells.join('')}</svg>`;
  }
  else if (dims === 2) {
    const h = Math.min(shape[0] === '?' ? 12 : shape[0], MAX);
    const w = Math.min(shape[1] === '?' ? 12 : shape[1], MAX);
    const cells = [];
    for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) {
      cells.push(`<rect x="${j*(CELL+1)}" y="${i*(CELL+1)}" width="${CELL}" height="${CELL}" fill="${color}" opacity="${seedVal(i,j)}"/>`);
    }
    vizHtml = `<svg class="tensor-viz" width="${w*(CELL+1)}" height="${h*(CELL+1)}">${cells.join('')}</svg>`;
  }
  else if (dims === 3 || dims === 4) {
    // 3D interactive canvas
    const id = 't3d_' + (++_t3dCounter);
    _pendingT3D.push({ id, shape, color });
    vizHtml = `<div class="tensor-3d">
      <div class="tensor-3d-head"><span>3D view</span><span class="tensor-3d-hint">drag · scroll · dbl-click reset</span></div>
      <canvas id="${id}" width="300" height="200"></canvas>
    </div>`;
  }
  else {
    vizHtml = `<div class="tensor-viz" style="width:20px;height:12px;background:${color};opacity:0.6"></div>`;
  }

  return `<div class="tensor">
    <span class="tensor-name">${name}</span>
    ${vizHtml}
    <span class="tensor-shape">${shapeStr}</span>
  </div>`;
}

// ============================================================
// 3D INTERACTIVE TENSOR VIEW  (canvas 2D + hand-rolled perspective)
// ============================================================
class Tensor3D {
  constructor(canvas, shape, color) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.shape = shape;
    this.color = color;
    this.theta = 0.6;   // azimuth (yaw)
    this.phi = 0.35;    // elevation (pitch)
    this.dist = 4.2;
    this.autoRotate = true;
    this.alive = true;
    this.dragging = false;
    this.points = this._buildPoints();
    this._attach();
    this._loop();
  }
  _buildPoints() {
    const s = this.shape;
    let dims;
    if (s.length === 3) {
      dims = s.map(v => typeof v === 'string' ? 6 : v);
    } else if (s.length === 4) {
      // [B, N, M, D]: show N × M × min(D, cap) volumetric, ignore batch
      const [, n, m, d] = s.map(v => typeof v === 'string' ? 8 : v);
      dims = [n, m, d];
    } else {
      dims = [4, 4, 4];
    }
    const CAP = 14;
    const show = dims.map(d => Math.min(d, CAP));
    // Cell spacing so cube stays inside ~[-1, 1]
    const spacing = 1.4 / Math.max(...show);
    const half = show.map(d => (d - 1) * spacing / 2);
    const pts = [];
    for (let x = 0; x < show[0]; x++)
    for (let y = 0; y < show[1]; y++)
    for (let z = 0; z < show[2]; z++) {
      pts.push({
        x: x * spacing - half[0],
        y: y * spacing - half[1],
        z: z * spacing - half[2],
        v: 0.35 + seedVal(x, y, z) * 0.55
      });
    }
    // Bounding box corners
    const bx = half[0] + spacing/2, by = half[1] + spacing/2, bz = half[2] + spacing/2;
    this.bboxCorners = [
      [-bx,-by,-bz],[bx,-by,-bz],[bx,by,-bz],[-bx,by,-bz],
      [-bx,-by, bz],[bx,-by, bz],[bx,by, bz],[-bx,by, bz],
    ];
    this.bboxEdges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    this.axesLabels = ['dim 0', 'dim 1', 'dim 2'];
    this.dimSizes = dims;
    return pts;
  }
  _project(x, y, z) {
    const ct = Math.cos(this.theta), st = Math.sin(this.theta);
    const cp = Math.cos(this.phi),   sp = Math.sin(this.phi);
    const x1 = x * ct + z * st;
    const z1 = -x * st + z * ct;
    const y1 = y * cp - z1 * sp;
    const z2 = y * sp + z1 * cp;
    const zc = z2 + this.dist;
    const f = 240 / Math.max(zc, 0.1);
    return { sx: x1 * f, sy: -y1 * f, depth: zc };
  }
  draw() {
    const { ctx, canvas } = this;
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    ctx.clearRect(0, 0, W, H);
    // BBox back faces first (behind points)
    const bproj = this.bboxCorners.map(([x,y,z]) => this._project(x,y,z));
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    this.bboxEdges.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(cx + bproj[a].sx, cy + bproj[a].sy);
      ctx.lineTo(cx + bproj[b].sx, cy + bproj[b].sy);
      ctx.stroke();
    });
    // Sort points back-to-front
    const projected = this.points.map(p => {
      const pr = this._project(p.x, p.y, p.z);
      return { ...pr, v: p.v };
    }).sort((a, b) => b.depth - a.depth);
    // Draw each as a small square
    const [R, G, B] = _hexToRgb(this.color);
    for (const p of projected) {
      const size = Math.max(1.4, 22 / p.depth);
      const dimFade = Math.max(0.25, 1 - (p.depth - 3) * 0.15);
      const a = p.v * dimFade;
      ctx.fillStyle = `rgba(${R},${G},${B},${a})`;
      ctx.fillRect(cx + p.sx - size/2, cy + p.sy - size/2, size, size);
    }
    // Dim label
    ctx.fillStyle = 'rgba(122, 126, 133, 0.6)';
    ctx.font = '9px "IBM Plex Mono", monospace';
    ctx.fillText(`${this.dimSizes.join(' × ')}`, 6, H - 6);
  }
  _attach() {
    let lx = 0, ly = 0;
    const c = this.canvas;
    const onDown = (e) => {
      this.dragging = true; this.autoRotate = false;
      lx = e.clientX; ly = e.clientY;
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!this.dragging) return;
      this.theta += (e.clientX - lx) * 0.008;
      this.phi = Math.max(-1.4, Math.min(1.4, this.phi + (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY;
    };
    const onUp = () => { this.dragging = false; };
    const onWheel = (e) => {
      e.preventDefault();
      this.dist = Math.max(2.2, Math.min(9, this.dist + e.deltaY * 0.004));
    };
    const onDbl = () => {
      this.theta = 0.6; this.phi = 0.35; this.dist = 4.2; this.autoRotate = true;
    };
    c.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    c.addEventListener('wheel', onWheel, { passive: false });
    c.addEventListener('dblclick', onDbl);
    this._detach = () => {
      c.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      c.removeEventListener('wheel', onWheel);
      c.removeEventListener('dblclick', onDbl);
    };
  }
  _loop() {
    if (!this.alive) return;
    if (this.autoRotate) this.theta += 0.004;
    this.draw();
    this._raf = requestAnimationFrame(() => this._loop());
  }
  dispose() {
    this.alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._detach) this._detach();
  }
}
function _hexToRgb(hex) {
  const m = hex.replace('#','').match(/.{2}/g);
  return m ? m.map(h => parseInt(h, 16)) : [200, 200, 200];
}
function _mountPendingT3D() {
  // Dispose any active ones
  _activeT3D.forEach(t => t.dispose());
  _activeT3D.length = 0;
  // Mount new
  _pendingT3D.forEach(({ id, shape, color }) => {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    _activeT3D.push(new Tensor3D(canvas, shape, color));
  });
  _pendingT3D.length = 0;
}

// ============================================================
// STEP DEFINITIONS
// ============================================================
// Each step: { id, node, title, shape, file, desc, op: {inputs, sym, output, formula} }
function buildSteps() {
  const N_p = cfg.N_prot, N_l = cfg.N_lig, N_ = N_p + N_l, S = cfg.S;
  const Mn = M();
  const C = {
    prot: '#7a9ec9', lig: '#7dbb8f', msa: '#c9a976', tmpl: '#a389c4',
    trunk: '#9b90d1', struct: '#d19b7d', conf: '#7dbfc4', aff: '#d47a86',
    accent: '#7c85f4',
  };

  const steps = [
    {
      id: 'config', node: null,
      title: 'Inputs configured',
      shape: `N_prot=${N_p} · N_lig=${N_l} · N=${N_} · S=${S}`,
      file: 'CLI: boltz predict',
      desc: `Total token count N = N_prot + N_lig = ${N_}. MSA depth S = ${S}. Approx atom count M ≈ ${Mn} (protein ~8 heavy atoms/residue). Click Play to run the flow.`,
    },
    {
      id: 'protein', node: 'protein',
      title: 'Protein sequence loaded',
      shape: `[${N_p}] residue ids`,
      file: 'data/parse/schema.py',
      desc: 'Each standard amino acid tokenizes 1:1 to a residue token. mol_type = PROTEIN (0). Feeds MSA + template pipeline.',
      op: { inputs: [], sym: null, output: { name: 'protein_tokens', shape: [N_p], color: C.prot } }
    },
    {
      id: 'ligand', node: 'ligand',
      title: 'Ligand tokenized per atom',
      shape: `[${N_l}] heavy-atom tokens`,
      file: 'data/tokenize/boltz2.py:260',
      desc: 'SMILES → RDKit 3D → each heavy atom becomes its own token. mol_type = NONPOLYMER (3). Affinity mode requires a single chain / single copy.',
      op: { inputs: [], sym: null, output: { name: 'ligand_tokens', shape: [N_l], color: C.lig } }
    },
    {
      id: 'msa', node: 'msa',
      title: 'MSA matrix',
      shape: `[${S}, ${N_p}] token ids`,
      file: 'data/msa/mmseqs2.py',
      desc: 'Multiple sequence alignment for the protein chain(s). Produces profile [N, num_tokens], deletion_mean [N], has_deletion, msa_paired.',
      op: { inputs: [], sym: null, output: { name: 'msa', shape: [S, N_p], color: C.msa } }
    },
    {
      id: 'tokenize', node: 'tokenize',
      title: 'tokenize_structure — merge into token table',
      shape: `[${N_}] combined tokens`,
      file: 'data/tokenize/boltz2.py:132',
      desc: 'Protein and ligand tokens concatenate into a single token table of length N. Each token gets affinity_mask (1 iff its chain is the affinity binder).',
      op: {
        inputs: [
          { name: 'protein', shape: [N_p], color: C.prot },
          { name: 'ligand',  shape: [N_l], color: C.lig  },
        ],
        sym: '⊕ concat',
        output: { name: 'tokens', shape: [N_], color: C.accent },
        formula: 'tokens = concat(protein_tokens, ligand_tokens)   ·   N = N_prot + N_lig'
      }
    },
    {
      id: 'featurizer', node: 'tokenize',
      title: 'Featurizer builds tensors',
      shape: `token_features · atom_features · msa_features`,
      file: 'data/feature/featurizerv2.py',
      desc: 'Featurizer produces token-level features (mol_type, res_type, bonds, contact_conditioning, affinity_token_mask) and atom-level features (ref_pos, ref_element, ref_charge, atom_backbone_feat) and MSA features (msa, profile, deletion_value, msa_paired).',
      op: {
        inputs: [ { name: 'tokens', shape: [N_], color: C.accent } ],
        sym: '→ featurize',
        output: { name: 'feats', shape: [N_, 'F'], color: C.accent },
        formula: 'feats = { token_pad_mask · mol_type · res_type · atom_pad_mask · ref_pos · profile · msa · ... }'
      }
    },
    {
      id: 'featurizer-aff', node: 'featurizer-aff',
      title: 'Affinity-only featurizer branch',
      shape: `profile_affinity [${N_}, 33] · affinity_mw scalar`,
      file: 'data/feature/featurizerv2.py:1647-1651',
      desc: 'Re-runs the MSA path with max_seqs=1 (query-only) so the affinity branch sees a clean, co-evolution-free profile. Also emits affinity_token_mask and the scalar mw. Both passes see these via the shared featurizer.',
      op: {
        inputs: [ { name: 'msa', shape: [S, N_p], color: C.msa } ],
        sym: '→ max_seqs=1',
        output: { name: 'profile_affinity', shape: [N_, 33], color: C.aff },
        formula: 'profile_affinity = mean(msa[:1], dim=0)   ·   deletion_mean_affinity  ·   affinity_mw'
      }
    },
    {
      id: 'embed', node: 'embed',
      title: 'InputEmbedder → s_inputs',
      shape: `s_inputs [1, ${N_}, ${D.token_s}]`,
      file: 'model/modules/trunkv2.py:68',
      desc: 'AtomEncoder + AtomAttentionEncoder aggregate atom features into per-token vectors. Then res_type + msa_profile encodings are added. Output is the initial token single stream.',
      op: {
        inputs: [
          { name: 'feats',   shape: [N_, 'F'], color: C.accent },
          { name: 'profile', shape: [N_, 33],  color: C.msa },
        ],
        sym: '→ MLP + attention',
        output: { name: 's_inputs', shape: [1, N_, D.token_s], color: C.trunk },
        formula: 's_inputs = res_type_enc(res_type) + msa_profile_enc(profile) + AtomAttentionEncoder(atoms)'
      }
    },
    {
      id: 'zinit', node: 'zinit',
      title: 'z_init — outer sum to pair stream',
      shape: `z_init [1, ${N_}, ${N_}, ${D.token_z}]`,
      file: 'model/models/boltz2.py:421-430',
      desc: 'The pair stream z is built as an outer sum of two linear projections of s_inputs, then enriched with relative position, token bonds, and contact conditioning. This is the substrate for all pairwise reasoning.',
      op: {
        inputs: [ { name: 's_inputs', shape: [1, N_, D.token_s], color: C.trunk } ],
        sym: '→ W₁ ⊕ W₂ (outer sum)',
        output: { name: 'z_init', shape: [1, N_, N_, D.token_z], color: C.trunk },
        formula: 'z_init[i,j] = W₁ · s[i] + W₂ · s[j] + rel_pos(i,j) + token_bonds(i,j) + contact(i,j)'
      }
    },
    {
      id: 'msamod', node: 'msa-mod',
      title: 'MSAModule — MSA → z messages',
      shape: `z [1, ${N_}, ${N_}, ${D.token_z}]`,
      file: 'model/modules/trunkv2.py:512',
      desc: 'MSA becomes a hidden stack m [B, S, N, 64]. Each block: PairWeightedAveraging (weighted by z), Transition, OuterProductMean (m → z), PairformerNoSeqLayer (triangles on z). Runs 4 blocks.',
      op: {
        inputs: [
          { name: 'z',   shape: [1, N_, N_, D.token_z], color: C.trunk },
          { name: 'msa', shape: [S, N_p],               color: C.msa   },
        ],
        sym: '→ 4× MSA blocks',
        output: { name: 'z', shape: [1, N_, N_, D.token_z], color: C.trunk },
        formula: 'z ← z + OuterProductMean(m, msa_mask) ; m ← m + PairWeightedAvg(m, z)'
      }
    },
    {
      id: 'pairformer', node: 'pairformer',
      title: 'PairformerModule — 48 triangle blocks',
      shape: `s, z after 48 blocks`,
      file: 'model/layers/pairformer.py:116',
      desc: 'z: TriangleMulOutgoing + TriangleMulIncoming + TriangleAttentionStartingNode + TriangleAttentionEndingNode + Transition. s: AttentionPairBias (self-attention with z as pair bias) + Transition. 48 blocks, 16 heads.',
      op: {
        inputs: [
          { name: 's', shape: [1, N_, D.token_s], color: C.trunk },
          { name: 'z', shape: [1, N_, N_, D.token_z], color: C.trunk },
        ],
        sym: '→ 48× Pairformer',
        output: { name: '(s, z)', shape: [1, N_, N_, D.token_z], color: C.trunk },
        formula: 'z += tri_mul_out(z) + tri_mul_in(z) + tri_att_start(z) + tri_att_end(z) + transition(z)'
      }
    },
    {
      id: 'recycling', node: 'recycling',
      title: 'Recycling — 3 iterations (pass 1)',
      shape: `loop × 3`,
      file: 'model/models/boltz2.py:439-491',
      desc: 's = s_init + s_recycle(LN(s)) and z = z_init + z_recycle(LN(z)). The trunk (template, MSA, pairformer) then runs again on the refreshed s, z. Only the last iteration has gradient (during training).',
      op: {
        inputs: [
          { name: 's_init', shape: [1, N_, D.token_s], color: C.trunk },
          { name: 's',      shape: [1, N_, D.token_s], color: C.trunk },
        ],
        sym: '↻',
        output: { name: 's_new', shape: [1, N_, D.token_s], color: C.trunk },
        formula: 's ← s_init + s_recycle(LN(s))   ·   z ← z_init + z_recycle(LN(z))'
      }
    },
    {
      id: 'distogram', node: 'distogram',
      title: 'DistogramModule — pair-distance head',
      shape: `pdistogram [1, ${N_}, ${N_}, ${D.bins}]`,
      file: 'model/modules/trunkv2.py:794',
      desc: 'Symmetrizes z (z + zᵀ) then a Linear projects to num_distograms · 64 bins. Predicts Cβ-Cβ pairwise distance distributions. Fed to confidence as pred_distogram_logits.',
      op: {
        inputs: [ { name: 'z', shape: [1, N_, N_, D.token_z], color: C.trunk } ],
        sym: '→ Linear(→64 bins)',
        output: { name: 'pdistogram', shape: [1, N_, N_, D.bins], color: C.trunk },
        formula: 'pdistogram = Linear(z + zᵀ) → [1, N, N, 64]'
      }
    },
    {
      id: 'diffcond', node: 'diffcond',
      title: 'DiffusionConditioning — precompute for diffusion',
      shape: `q [1, ${M()}, ${D.atom_s}] · c · biases`,
      file: 'model/modules/diffusion_conditioning.py',
      desc: 'Runs once per Boltz2.forward and is REUSED across every diffusion step. PairwiseConditioning enriches z; AtomEncoder(structure=True) broadcasts s and z to atom / atom-pair space; prepares LN+Linear bias tensors for every atom encoder / token transformer / atom decoder layer.',
      op: {
        inputs: [
          { name: 's', shape: [1, N_, D.token_s], color: C.trunk },
          { name: 'z', shape: [1, N_, N_, D.token_z], color: C.trunk },
        ],
        sym: '→ AtomEncoder + Pairwise',
        output: { name: '{q, c, biases}', shape: [1, M(), D.atom_s], color: C.struct },
        formula: 'q, c, atom_enc_bias, atom_dec_bias, token_trans_bias = DiffusionConditioning(s, z, rel_pos, feats)'
      }
    },
    {
      id: 'atomdiff', node: 'atomdiff',
      title: 'AtomDiffusion.sample — iterative denoising',
      shape: `sample_atom_coords [S, ${M()}, 3]`,
      file: 'model/modules/diffusionv2.py:295',
      desc: 'Karras (2022) EDM sampler. Start from x_T ~ N(0, σ_max²·I), iterate T steps with c_skip/c_out/c_in preconditioning. Each step calls DiffusionModule: AtomAttn Enc → TokenTx → AtomAttn Dec → r_update. Optional steering: FK particle resample, physical / contact guidance.',
      op: {
        inputs: [ { name: '{q, c, biases}', shape: [1, M(), D.atom_s], color: C.struct } ],
        sym: '→ T diffusion steps',
        output: { name: 'sample_atom_coords', shape: [5, M(), 3], color: C.struct },
        formula: 'x̂ = c_skip(σ) · x_t + c_out(σ) · DiffusionModule(c_in(σ)·x_t, σ, cond)   ·   iterate σ_max → σ_min'
      }
    },
    {
      id: 'confidence', node: 'confidence',
      title: 'ConfidenceModule — plddt / pae / pde / iptm',
      shape: `iptm [S] · plddt [N, 50] · pae [N, N, 64]`,
      file: 'model/modules/confidencev2.py:19',
      desc: 'Trunk gradient .detach()\'d. z\' = LN(z) + s→z + s→zᵀ; then cdist on x_pred → bin embed adds to z\'. A separate PairformerModule (v2) runs, then Heads: pLDDT [50], PAE [64], PDE [64], resolved [2]. compute_ptms yields ptm, iptm, ligand_iptm, protein_iptm.',
      op: {
        inputs: [
          { name: 's,z',    shape: [1, N_, N_, D.token_z], color: C.trunk },
          { name: 'x_pred', shape: [5, M(), 3],            color: C.struct },
        ],
        sym: '→ v2 Pairformer + heads',
        output: { name: 'iptm', shape: [5], color: C.conf },
        formula: 'z′ = LN(z) + s→z + s→zᵀ + Embed(cdist(x_pred))   →   Pairformer(v2)   →   heads'
      }
    },
    {
      id: 'pass1-done', node: 'iptm',
      title: 'Pass 1 complete — model_0.pdb written',
      shape: `model_0..${cfg.affinity ? '4' : 'S-1'}.pdb · confidence_summary.json`,
      file: 'data/write/writer.py (BoltzWriter)',
      desc: 'Structure checkpoint writes S predicted PDBs and a confidence summary JSON. If no record has affinity, the run ends here.',
    },
  ];

  if (cfg.affinity) {
    steps.push(
      {
        id: 'trigger', node: 'pass2-trigger',
        title: 'Trigger — reload affinity checkpoint',
        shape: `Boltz2 ← boltz2_aff.ckpt`,
        file: 'main.py:1336 · main.py:1391',
        desc: 'if any(r.affinity for r in manifest.records): a second Boltz2 is loaded from the affinity checkpoint. Fresh DataModule with affinity=True. steering_args disabled. sampling_steps_affinity, diffusion_samples_affinity. BoltzAffinityWriter swaps in as pred_writer.',
      },
      {
        id: 'rerun', node: 'rerun',
        title: 'Pass 2 — full pipeline re-runs',
        shape: `trunk + sample() + confidence + affinity`,
        file: 'Boltz2.forward under aff ckpt',
        desc: 'Boltz2.forward always executes trunk → structure → confidence before entering the affinity branch. Pass 2 therefore recomputes ALL of them under the aff ckpt weights. The re-sampled pose reproduces pass 1\'s model_0.pdb (verified C-side).',
      },
      {
        id: 'trunk-p2', node: 'trunk-p2',
        title: 'Pass 2 · Trunk (re-run)',
        shape: `pass2.s, pass2.z`,
        file: 'model/models/boltz2.py:415-490',
        desc: 'Same InputEmbedder / MSA / Template / Pairformer stack, now under the aff ckpt weights. Runs 5 recycling steps by default (main.py:1373).',
        op: {
          inputs: [ { name: 'feats', shape: [N_, 'F'], color: C.accent } ],
          sym: '→ trunk (aff weights)',
          output: { name: 'pass2.z', shape: [1, N_, N_, D.token_z], color: C.trunk },
          formula: 'reruns bands 03 with affinity_checkpoint.state_dict()'
        }
      },
      {
        id: 'diffusion-p2', node: 'diffusion-p2',
        title: 'Pass 2 · AtomDiffusion.sample (again)',
        shape: `pass2.sample_atom_coords [5, ${M()}, 3]`,
        file: 'model/modules/diffusionv2.py:295',
        desc: 'Called AGAIN inside pass 2\'s Boltz2.forward — this is the second AtomDiffusion.sample() of the run. steering off (no FK, no guidance). The pose it produces reproduces pass 1\'s model_0.pdb.',
        op: {
          inputs: [ { name: 'pass2.{q,c}', shape: [1, M(), D.atom_s], color: C.struct } ],
          sym: '→ T diffusion steps',
          output: { name: 'pass2.coords', shape: [5, M(), 3], color: C.struct },
          formula: 'x̂ = c_skip · x_t + c_out · DiffusionModule(...)   ·   aff ckpt weights   ·   no steering'
        }
      },
      {
        id: 'confidence-p2', node: 'confidence-p2',
        title: 'Pass 2 · ConfidenceModule (again)',
        shape: `pass2.iptm [5]`,
        file: 'model/modules/confidencev2.py:19',
        desc: 'Runs under aff ckpt weights, producing an independent iptm vector. This — not pass 1\'s iptm — is what feeds argmax below.',
        op: {
          inputs: [
            { name: 'pass2.s,z', shape: [1, N_, N_, D.token_z], color: C.trunk },
            { name: 'pass2.coords', shape: [5, M(), 3], color: C.struct },
          ],
          sym: '→ v2 Pairformer + heads',
          output: { name: 'pass2.iptm', shape: [5], color: C.conf },
        }
      },
      {
        id: 'embed-p2', node: 'embed-p2',
        title: 'InputEmbedder(feats, affinity=True) — s_inputs′',
        shape: `s_inputs′ [1, ${N_}, ${D.token_s}]`,
        file: 'trunkv2.py:173-179',
        desc: 'Called near the end of pass 2 forward, right before the AffinityModule. Swaps in profile_affinity + deletion_mean_affinity so the affinity decision is not confounded by MSA co-evolution.',
        op: {
          inputs: [
            { name: 'feats', shape: [N_, 'F'], color: C.accent },
            { name: 'profile_affinity', shape: [N_, 33], color: C.aff },
          ],
          sym: '→ InputEmbedder',
          output: { name: 's_inputs′', shape: [1, N_, D.token_s], color: C.aff },
          formula: 's_inputs′ = res_type_enc + msa_profile_enc(profile_affinity) + AtomAttentionEncoder(atoms)'
        }
      },
      {
        id: 'best-pose', node: 'best-pose',
        title: 'Pick canonical pose — argmax(pass2.iptm)',
        shape: `coords_affinity [1, 1, ${M()}, 3]`,
        file: 'boltz2.py:622-626',
        desc: 'best_idx = argsort(pass2.iptm)[0].item(); coords_affinity = pass2.sample_atom_coords[best_idx][None, None]. Note: this uses pass 2\'s own iptm and coords — not the ones from pass 1.',
        op: {
          inputs: [
            { name: 'pass2.iptm',   shape: [5], color: C.conf },
            { name: 'pass2.coords', shape: [5, M(), 3], color: C.struct },
          ],
          sym: '→ index[argmax]',
          output: { name: 'coords_affinity', shape: [1, 1, M(), 3], color: C.aff },
          formula: 'best_idx = argmax(pass2.iptm)   ·   coords_affinity = pass2.coords[best_idx]'
        }
      },
      {
        id: 'crossmask', node: 'crossmask',
        title: 'cross_pair_mask & z_affinity',
        shape: `mask [${N_}, ${N_}] · z_affinity [1, ${N_}, ${N_}, ${D.token_z}]`,
        file: 'boltz2.py:610-620',
        desc: 'rec_mask = (mol_type == 0) & pad. lig_mask = affinity_token_mask & pad. cross_pair_mask = lig⊗rec + rec⊗lig + lig⊗lig. Then z_affinity = pass2.z · mask. The entire protein–protein sub-block is zeroed out.',
        op: {
          inputs: [
            { name: 'pass2.z', shape: [1, N_, N_, D.token_z], color: C.trunk },
            { name: 'mask',    shape: [N_, N_],               color: C.aff   },
          ],
          sym: '⊙ element-wise',
          output: { name: 'z_affinity', shape: [1, N_, N_, D.token_z], color: C.aff },
          formula: 'mask = lig⊗rec + rec⊗lig + lig⊗lig   ·   z_affinity = pass2.z ⊙ mask[None,:,:,None]'
        }
      },
      {
        id: 'affmod', node: 'affmod',
        title: 'AffinityModule — masked pair pooling → MLP',
        shape: `affinity_pred_value [1, 1] · logits_binary [1, 1]`,
        file: 'model/modules/affinity.py:34',
        desc: '(1) z = LinearNoBias(LN(z)) + s′→z outer. (2) cdist(x_pred_repr) → dist_bin_pairwise_embed. (3) z += PairwiseConditioning(z, distogram). (4) PairformerNoSeqModule(z, pair_mask=cross_pair_mask) — no s-track. (5) AffinityHeadsTransformer: masked pool → MLP → pred_value (regression) and pred_score → Linear → logits_binary.',
        op: {
          inputs: [
            { name: 's_inputs′',        shape: [1, N_, D.token_s], color: C.aff },
            { name: 'z_affinity',       shape: [1, N_, N_, D.token_z], color: C.aff },
            { name: 'coords_affinity',  shape: [1, 1, M(), 3], color: C.aff },
          ],
          sym: '→ heads',
          output: { name: 'pred_value', shape: [1, 1], color: C.aff },
          formula: 'g = Σᵢⱼ z_{ij}·mask_{ij}(1 − I) / Σ mask   →   MLP   →   pred_value  ·  logits_binary'
        }
      },
      {
        id: 'ensemble', node: 'ensemble',
        title: 'Ensemble average (optional)',
        shape: `v̄ [1, 1] · p̄ [1, 1]`,
        file: 'boltz2.py:630-702',
        desc: 'When affinity_ensemble=True, two AffinityModule instances (1 & 2) with different config run on the same z_affinity / coords_affinity / s_inputs′. Averaging reduces variance and improves probability calibration.',
        op: {
          inputs: [
            { name: 'v₁, l₁', shape: [1, 1], color: C.aff },
            { name: 'v₂, l₂', shape: [1, 1], color: C.aff },
          ],
          sym: '→ mean',
          output: { name: 'v̄, p̄', shape: [1, 1], color: C.aff },
          formula: 'v̄ = (v₁ + v₂) / 2   ·   p̄ = (σ(l₁) + σ(l₂)) / 2'
        }
      },
      {
        id: 'mw', node: 'mw',
        title: 'MW correction (default on)',
        shape: `v′ [1, 1]`,
        file: 'boltz2.py:688-698',
        desc: 'Post-training linear regression against ligand MW^0.3 removes the "larger ligand = better binding" bias. Constants from a least-squares fit.',
        op: {
          inputs: [
            { name: 'v̄',  shape: [1, 1], color: C.aff },
            { name: 'mw', shape: [1],    color: C.aff },
          ],
          sym: '→ affine',
          output: { name: 'v′', shape: [1, 1], color: C.aff },
          formula: 'v′ = 1.03526·v̄  −  0.59993·mw^0.3  +  2.83288'
        }
      },
      {
        id: 'finalout', node: 'finalout',
        title: 'affinity_pred_value & probability',
        shape: `pred_value + probability_binary`,
        file: 'BoltzAffinityWriter · affinity.json',
        desc: 'BoltzAffinityWriter serializes pred_value (regression, pKd/pIC50-like) and probability_binary (sigmoid, binder / non-binder) into affinity.json / .npz. Bundled with plddt, iptm, ptm outputs.',
      },
    );
  }
  return steps;
}

// ============================================================
// RENDER
// ============================================================
let STEPS = [];
let stepIdx = 0;
let playing = false;
let playTimer = null;

function renderStep() {
  const step = STEPS[stepIdx];
  if (!step) return;

  const info = document.getElementById('info');
  const isAff = step.node && ['pass2-trigger','rerun','trunk-p2','diffusion-p2','confidence-p2','embed-p2','best-pose','crossmask','affmod','ensemble','mw','finalout','featurizer-aff','affinfo'].includes(step.node);

  let html = `
    <div class="kicker"><span class="step-badge">STEP ${stepIdx + 1}</span> ${isAff ? 'pass 2 · affinity' : (stepIdx > 8 && stepIdx < 20 ? 'pass 1 · structure' : 'input & featurize')}</div>
    <h2>${step.title}</h2>
    <div class="shape">${step.shape}</div>
    <div class="file">${step.file}</div>
    <p>${step.desc}</p>
  `;

  if (step.op) {
    html += `<div class="op-block">
      <div class="op-title">tensor transformation</div>`;
    if (step.op.inputs.length > 0) {
      html += `<div class="op-row">`;
      step.op.inputs.forEach((t, i) => {
        if (i > 0) html += `<span class="op-sym">·</span>`;
        html += renderTensor(t.name, t.shape, t.color);
      });
      html += `</div>`;
      html += `<div class="op-row"><span class="op-sym">${step.op.sym || '→'}</span></div>`;
    }
    html += `<div class="op-row">`;
    html += renderTensor(step.op.output.name, step.op.output.shape, step.op.output.color);
    html += `</div>`;
    if (step.op.formula) {
      html += `<div class="op-formula">${step.op.formula}</div>`;
    }
    html += `</div>`;
  }

  info.innerHTML = html;
  _mountPendingT3D();

  // Highlight node
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active', 'active-aff'));
  if (step.node) {
    const nodeEl = document.querySelector(`[data-id="${step.node}"]`);
    if (nodeEl) {
      nodeEl.classList.add(isAff ? 'active-aff' : 'active');
      // Scroll into view
      const rect = nodeEl.getBoundingClientRect();
      const stageRect = document.getElementById('stage').getBoundingClientRect();
      if (rect.top < stageRect.top || rect.bottom > stageRect.bottom) {
        nodeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  // Progress
  document.getElementById('progress').style.width = `${((stepIdx + 1) / STEPS.length) * 100}%`;
  document.getElementById('step-cur').textContent = stepIdx + 1;
  document.getElementById('step-tot').textContent = STEPS.length;
}

function rebuild() {
  readCfg();
  STEPS = buildSteps();
  // clamp
  if (stepIdx >= STEPS.length) stepIdx = STEPS.length - 1;

  // Dim affinity nodes when affinity=false
  const svg = document.getElementById('svg');
  svg.classList.toggle('dim-affinity', !cfg.affinity);
  document.getElementById('affState').textContent = cfg.affinity ? 'true' : 'false';
  document.getElementById('affState').style.color = cfg.affinity ? 'var(--aff)' : 'var(--muted)';

  renderStep();
}

// ============================================================
// EVENT WIRING
// ============================================================
document.getElementById('btn-next').addEventListener('click', () => {
  stepIdx = Math.min(STEPS.length - 1, stepIdx + 1);
  renderStep();
});
document.getElementById('btn-prev').addEventListener('click', () => {
  stepIdx = Math.max(0, stepIdx - 1);
  renderStep();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  pause();
  stepIdx = 0;
  renderStep();
});
document.getElementById('btn-play').addEventListener('click', () => {
  if (playing) pause(); else play();
});
document.getElementById('affToggle').addEventListener('change', rebuild);
['cfg-prot', 'cfg-lig', 'cfg-msa'].forEach(id => {
  document.getElementById(id).addEventListener('input', rebuild);
});

function play() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ Pause';
  const speed = +document.getElementById('speed').value;
  playTimer = setInterval(() => {
    if (stepIdx >= STEPS.length - 1) { pause(); return; }
    stepIdx += 1;
    renderStep();
  }, speed);
}
function pause() {
  playing = false;
  document.getElementById('btn-play').textContent = '▶ Play';
  if (playTimer) clearInterval(playTimer);
  playTimer = null;
}
document.getElementById('speed').addEventListener('input', () => {
  if (playing) { pause(); play(); }
});

// Click a node to jump to first step involving it
document.querySelectorAll('.node').forEach(el => {
  el.addEventListener('click', () => {
    const id = el.dataset.id;
    const idx = STEPS.findIndex(s => s.node === id);
    if (idx >= 0) { stepIdx = idx; renderStep(); }
  });
});

// ============================================================
// RESIZABLE PANEL (drag divider)
// ============================================================
const divider = document.getElementById('divider');
const mainEl = document.querySelector('main');
const STORAGE_KEY = 'boltz2arch.panelWidth';
const savedW = +localStorage.getItem(STORAGE_KEY);
if (savedW && savedW >= 280 && savedW <= 800) {
  mainEl.style.gridTemplateColumns = `1fr 5px ${savedW}px`;
}
let _dragResize = false;
divider.addEventListener('mousedown', (e) => {
  _dragResize = true;
  document.body.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!_dragResize) return;
  const w = Math.max(280, Math.min(800, window.innerWidth - e.clientX));
  mainEl.style.gridTemplateColumns = `1fr 5px ${w}px`;
});
window.addEventListener('mouseup', () => {
  if (!_dragResize) return;
  _dragResize = false;
  document.body.classList.remove('dragging');
  const w = mainEl.style.gridTemplateColumns.match(/(\d+)px$/);
  if (w) localStorage.setItem(STORAGE_KEY, w[1]);
});

// Init
rebuild();
</script>
</body>
</html>
